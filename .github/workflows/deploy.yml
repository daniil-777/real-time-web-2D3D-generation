# Every push to main: build the site (build.mjs → _site/), open it in headless Chrome (test/smoke.mjs: each app must
# start and answer, no console errors), then publish it to GitHub Pages. The unit tests of Arch Studio's generators
# run alongside (they take a while) and mark the commit, without holding the deploy.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Smoke test in headless Chrome
        # the runner has no GPU: the CAD app starts on software WebGL, the neural apps would not at a useful speed
        run: node test/smoke.mjs --dir _site --only arch --budget 300000 --out smoke
        timeout-minutes: 8
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: smoke
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          ARCH_TIME_SCALE: "3"   # build-time budgets are set for the development machine; the runner is slower
